{{- if and (eq .Values.adapter.mode "kubernetes") (not .Values.rbac.kubernetesAdapter.enabled) }}
{{- fail "rbac.kubernetesAdapter.enabled must be true when adapter.mode=kubernetes" }}
{{- end }}
{{- if and .Values.rbac.kubernetesAdapter.enabled (ne .Values.adapter.mode "kubernetes") }}
{{- fail "adapter.mode must be kubernetes when Kubernetes RBAC is enabled" }}
{{- end }}
{{- if and .Values.adapter.kafkaRest.enabled (ne .Values.adapter.mode "kubernetes") }}
{{- fail "adapter.mode must be kubernetes when Kafka REST probing is enabled" }}
{{- end }}
{{- if and .Values.adapter.kafkaRest.enabled (empty .Values.networkPolicy.extraEgress) }}
{{- fail "networkPolicy.extraEgress must explicitly allow the Kafka REST endpoint when probing is enabled" }}
{{- end }}
{{- if and .Values.adapter.credentialBroker.enabled (ne .Values.adapter.mode "kubernetes") }}
{{- fail "adapter.mode must be kubernetes when credential broker probing is enabled" }}
{{- end }}
{{- if and .Values.adapter.egressGateway.enabled (ne .Values.adapter.mode "kubernetes") }}
{{- fail "adapter.mode must be kubernetes when egress gateway probing is enabled" }}
{{- end }}
{{- if and (or .Values.adapter.credentialBroker.enabled .Values.adapter.egressGateway.enabled) (empty .Values.networkPolicy.extraEgress) }}
{{- fail "networkPolicy.extraEgress must explicitly allow configured Week 4 probe endpoints" }}
{{- end }}
{{- if and .Values.adapter.restartGateway.enabled (ne .Values.adapter.mode "kubernetes") }}
{{- fail "adapter.mode must be kubernetes when restart probing is enabled" }}
{{- end }}
{{- if and (or .Values.adapter.restartGateway.enabled .Values.siem.enabled) (empty .Values.networkPolicy.extraEgress) }}
{{- fail "networkPolicy.extraEgress must explicitly allow configured Week 5 endpoints" }}
{{- end }}
{{- if eq .Values.image.tag "latest" }}
{{- fail "image.tag must be immutable and cannot be latest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asv.fullname" . }}
  labels:
    {{- include "asv.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  minReadySeconds: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "asv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asv.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "asv.controllerServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.rbac.kubernetesAdapter.enabled }}
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --database
            - /data/asv.db
            - --deadline-seconds
            - {{ .Values.controller.deadlineSeconds | quote }}
          env:
            - name: ASV_RECOVERY_INTERVAL_SECONDS
              value: {{ .Values.controller.recoveryIntervalSeconds | quote }}
            - name: ASV_ADAPTER_MODE
              value: {{ .Values.adapter.mode | quote }}
            - name: ASV_ALLOWED_NAMESPACES
              value: {{ join "," .Values.adapter.allowedNamespaces | quote }}
            - name: ASV_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.authSecretKey }}
            - name: ASV_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.signingKeyKey }}
            {{- if .Values.adapter.kafkaRest.enabled }}
            - name: ASV_KAFKA_REST_URL
              value: {{ required "adapter.kafkaRest.url is required when Kafka REST probing is enabled" .Values.adapter.kafkaRest.url | quote }}
            - name: ASV_KAFKA_TOPIC
              value: {{ .Values.adapter.kafkaRest.topic | quote }}
            - name: ASV_KAFKA_CONSUMER_GROUP
              value: {{ .Values.adapter.kafkaRest.consumerGroup | quote }}
            - name: ASV_KAFKA_CONSUMER_INSTANCE
              value: {{ .Values.adapter.kafkaRest.consumerInstance | quote }}
            - name: ASV_KAFKA_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.adapter.kafkaRest.bearerTokenSecretKey }}
            {{- end }}
            {{- if .Values.adapter.credentialBroker.enabled }}
            - name: ASV_CREDENTIAL_BROKER_URL
              value: {{ required "adapter.credentialBroker.url is required when credential probing is enabled" .Values.adapter.credentialBroker.url | quote }}
            - name: ASV_CREDENTIAL_TEST_RESOURCE
              value: {{ .Values.adapter.credentialBroker.testResource | quote }}
            - name: ASV_CREDENTIAL_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.adapter.credentialBroker.controllerTokenSecretKey }}
            {{- end }}
            {{- if .Values.adapter.egressGateway.enabled }}
            - name: ASV_EGRESS_GATEWAY_URL
              value: {{ required "adapter.egressGateway.url is required when network probing is enabled" .Values.adapter.egressGateway.url | quote }}
            - name: ASV_EGRESS_TEST_DESTINATION
              value: {{ required "adapter.egressGateway.testDestination is required when network probing is enabled" .Values.adapter.egressGateway.testDestination | quote }}
            - name: ASV_EGRESS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.adapter.egressGateway.controllerTokenSecretKey }}
            {{- end }}
            {{- if .Values.adapter.restartGateway.enabled }}
            - name: ASV_RESTART_GATEWAY_URL
              value: {{ required "adapter.restartGateway.url is required when restart probing is enabled" .Values.adapter.restartGateway.url | quote }}
            - name: ASV_RESTART_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.adapter.restartGateway.controllerTokenSecretKey }}
            {{- end }}
            {{- if .Values.siem.enabled }}
            - name: ASV_SIEM_URL
              value: {{ required "siem.url is required when SIEM delivery is enabled" .Values.siem.url | quote }}
            - name: ASV_SIEM_INTERVAL_SECONDS
              value: {{ .Values.siem.intervalSeconds | quote }}
            - name: ASV_SIEM_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.siem.bearerTokenSecretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "asv.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
