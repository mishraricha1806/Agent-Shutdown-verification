{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asv.fullname" . }}
  labels:
    {{- include "asv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asv.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            {{- toYaml .Values.networkPolicy.ingressPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if eq .Values.adapter.mode "kubernetes" }}
    - to:
        - ipBlock:
            cidr: {{ required "networkPolicy.kubernetesApiCIDR is required when adapter.mode=kubernetes" .Values.networkPolicy.kubernetesApiCIDR }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
