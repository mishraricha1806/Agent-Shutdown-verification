{{- if .Values.rbac.kubernetesAdapter.enabled }}
{{- range $namespace := .Values.adapter.allowedNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "asv.fullname" $ }}-controller
  namespace: {{ $namespace }}
  labels:
    {{- include "asv.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "asv.fullname" $ }}-controller
  namespace: {{ $namespace }}
  labels:
    {{- include "asv.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "asv.controllerServiceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "asv.fullname" $ }}-controller
---
{{- end }}
{{- end }}
